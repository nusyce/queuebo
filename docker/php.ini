; Stackposts runtime PHP settings
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
expose_php = Off
date.timezone = UTC

; Sessions/logs go through Laravel; keep PHP quiet on stdout
log_errors = On
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
