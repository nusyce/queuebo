server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 128M;

    # Long-lived caching for the Vite build output
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Theme "shared plugin" assets (Font Awesome, flag icons, Highcharts,
    # CodeMirror, ...) are shipped under resources/themes/, outside the
    # public/ root, and referenced via theme_shared_asset()/theme_asset()
    # as /resources/themes/...  Serve that subtree as static files; the
    # rest of resources/ (blade views, lang, ...) stays private.
    location ^~ /resources/themes/ {
        alias /var/www/html/resources/themes/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;

        # Never serve template / PHP source that also lives in this tree.
        location ~ \.(php|blade\.php)$ {
            deny all;
        }
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Pins HTTP_HOST / scheme to APP_URL so generated URLs keep the right
        # host:port even when a port-forwarding proxy rewrites the Host header
        # (Docker Desktop does this). Written by the entrypoint from .env.
        include /etc/nginx/app_host.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny dotfiles (.env, .git, ...) and VCS metadata
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
